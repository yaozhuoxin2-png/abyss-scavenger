<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0705">
  <meta name="description" content="深渊拾荒者：暗黑哥特像素动作地牢。深入六层遗迹，收集装备并击败机制各异的多命首领。">
  <title>深渊拾荒者 · Abyss Scavenger</title>
  <link rel="preload" as="image" href="./hero-sprites-v4.png">
  <link rel="preload" as="image" href="./enemy-sprites-v4.png">
  <link rel="preload" as="image" href="./bosses-gothic.png">
  <link rel="stylesheet" href="./style.css?v=6.1">
</head>
<body>
  <header class="masthead"><a class="brand" href="./"><span class="brand-mark">✦</span><span>深渊拾荒者<small>ABYSS SCAVENGER</small></span></a><div class="top-actions"><span class="version">六王异象 · v6.1</span><button id="sound" aria-pressed="false">音效：关</button><button id="help">操作说明 <kbd>?</kbd></button><button id="pause">暂停 <kbd>Esc</kbd></button></div></header>
  <main>
    <div class="chapter-bar"><div><span class="eyebrow">THE DESCENT</span><h1 id="chapter">第一层 <span>· 苔影遗迹</span></h1></div><div class="depth"><span id="depth1" class="active">01</span><i></i><span id="depth2">02</span><i></i><span id="depth3">03</span><i></i><span id="depth4">04</span><i></i><span id="depth5">05</span><i></i><span id="depth6">06</span></div><div class="objective"><span class="status-dot"></span><span id="objective">准备进入深渊</span></div></div>
    <div class="game-layout">
      <section class="arena-wrap" aria-label="地下城战场"><canvas id="arena" width="1040" height="720" tabindex="0" aria-label="游戏战场。WASD移动，鼠标点击寻路或攻击，空格攻击；按 Shift、1 或 2 后，用鼠标左键指定施法，右键取消；3切换武器，4和5释放一次性神器，Q使用药水，I打开背包。"></canvas><div class="arena-label"><span>✦</span> <span id="area-name">苔影遗迹</span></div><div id="wave-banner" aria-live="polite"></div><div id="bossbar" hidden><span id="boss-name"></span><div><i id="boss-health"></i></div></div><div id="toast" role="status"></div><div class="arena-bottom"><span id="mode">鼠标点击移动 / WASD 移动</span><span id="time">00:00</span></div></section>
      <aside><div class="hero-card"><div class="portrait">♜</div><div><span class="eyebrow">拾荒者</span><h2 id="hero-name">灰烬行者</h2><span class="muted" id="level">等级 1</span></div><span class="level-badge" id="level-badge">01</span></div><div class="vitals"><div class="meter-label"><span>生命</span><strong id="hp-text">1200 / 1200</strong></div><div class="meter health"><i id="hp-fill"></i></div><div class="meter-label"><span>法力</span><strong id="mana-text">80 / 80</strong></div><div class="meter mana"><i id="mana-fill"></i></div><div class="meter-label xp-label"><span>经验</span><span id="xp-text">0 / 55</span></div><div class="meter experience"><i id="xp-fill"></i></div></div><div class="stats"><div><span>攻击</span><strong id="attack">18</strong></div><div><span>护甲</span><strong id="armor">0</strong></div><div><span>暴击</span><strong id="crit">8%</strong></div><div><span>速度</span><strong id="speed">155</strong></div><div><span>吸血率</span><strong id="leech">0%</strong></div><div><span>金币</span><strong id="gold" class="gold">0</strong></div></div><div class="section-title"><h3>当前装备</h3><button id="inventory">背包 <kbd>I</kbd></button></div><div id="equipment" class="equipment"></div><div class="section-title"><h3>拾荒记录</h3><span class="eyebrow">LOG</span></div><div id="log" class="log" aria-live="polite"><p>火光尚未熄灭。</p><p>选择武器，开始你的远征。</p></div><div class="aside-foot"><span id="save-status">✓ 本地存档已就绪</span><br><span id="best">本机纪录：尚无远征</span></div></aside>
    </div>
    <div class="action-bar"><div class="action-group combat-actions"><button id="basic" class="skill"><kbd>Space</kbd><span>普通攻击</span><small>或点击敌人</small></button><button id="dash" class="skill"><kbd>Shift</kbd><span id="dash-name">铁壁突进</span><small id="dash-cd">就绪</small></button><button id="spin" class="skill"><kbd>1</kbd><span id="spin-name">裂地横扫</span><small id="spin-cd">就绪</small></button><button id="frost" class="skill"><kbd>2</kbd><span id="frost-name">剑气震荡</span><small id="frost-cd">就绪</small></button><button id="switch-weapon" class="skill switch"><kbd>3</kbd><span>切换武器</span><small id="weapon-label">副武器未装备</small></button></div><div class="action-group utility-actions"><button id="artifact-life" class="skill artifact-skill life-artifact" disabled><kbd>4</kbd><span>生命圣器</span><small>尚未获得</small></button><button id="artifact-aegis" class="skill artifact-skill aegis-artifact" disabled><kbd>5</kbd><span>停滞神徽</span><small>尚未获得</small></button><div class="potion-wrap"><button id="potion" class="skill potion"><kbd>Q</kbd><span>生命药水</span><small id="potions">3 瓶</small></button><div id="potion-tray" class="potion-tray" aria-label="持有的药水"></div></div><button id="interact" class="skill"><kbd>E</kbd><span>拾取 / 下一层</span><small>也可点击地面</small></button></div></div>
    <footer><span>走进深渊，把传说带回来。</span><span>推荐电脑浏览器 · 键盘与鼠标</span></footer>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="./game.mjs?v=6.1"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1218">
  <meta name="description" content="深渊拾荒者：单人动作地牢游戏。探索三层遗迹，击败怪物，收集装备，挑战深渊守卫。支持鼠标寻路和键盘移动。">
  <title>深渊拾荒者 · Abyss Scavenger</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="masthead"><a class="brand" href="./"><span class="brand-mark">✦</span><span>深渊拾荒者<small>ABYSS SCAVENGER</small></span></a><div class="top-actions"><span class="version">单人冒险 · v1.0</span><button id="sound" aria-pressed="false">音效：关</button><button id="help">操作说明 <kbd>?</kbd></button><button id="pause">暂停 <kbd>Esc</kbd></button></div></header>
  <main>
    <div class="chapter-bar"><div><span class="eyebrow">THE DESCENT</span><h1 id="chapter">第一层 <span>· 苔影遗迹</span></h1></div><div class="depth"><span id="depth1" class="active">01</span><i></i><span id="depth2">02</span><i></i><span id="depth3">03</span></div><div class="objective"><span class="status-dot"></span><span id="objective">准备进入深渊</span></div></div>
    <div class="game-layout">
      <section class="arena-wrap" aria-label="地下城战场"><canvas id="arena" width="1040" height="720" tabindex="0" aria-label="游戏战场。WASD移动，鼠标点击寻路或攻击，空格攻击，Shift闪避，1旋风斩，2冰霜冲击，Q药水，I背包。"></canvas><div class="arena-label"><span>✦</span> <span id="area-name">苔影遗迹</span></div><div id="wave-banner" aria-live="polite"></div><div id="bossbar" hidden><span id="boss-name"></span><div><i id="boss-health"></i></div></div><div id="toast" role="status"></div><div class="arena-bottom"><span id="mode">鼠标点击移动 / WASD 移动</span><span id="time">00:00</span></div></section>
      <aside><div class="hero-card"><div class="portrait">♜</div><div><span class="eyebrow">拾荒者</span><h2 id="hero-name">灰烬行者</h2><span class="muted" id="level">等级 1</span></div><span class="level-badge" id="level-badge">01</span></div><div class="vitals"><div class="meter-label"><span>生命</span><strong id="hp-text">120 / 120</strong></div><div class="meter health"><i id="hp-fill"></i></div><div class="meter-label xp-label"><span>经验</span><span id="xp-text">0 / 35</span></div><div class="meter experience"><i id="xp-fill"></i></div></div><div class="stats"><div><span>攻击</span><strong id="attack">18</strong></div><div><span>护甲</span><strong id="armor">0</strong></div><div><span>暴击</span><strong id="crit">8%</strong></div><div><span>金币</span><strong id="gold" class="gold">0</strong></div></div><div class="section-title"><h3>当前装备</h3><button id="inventory">背包 <kbd>I</kbd></button></div><div id="equipment" class="equipment"></div><div class="section-title"><h3>拾荒记录</h3><span class="eyebrow">LOG</span></div><div id="log" class="log" aria-live="polite"><p>火光尚未熄灭。</p><p>选择武器，开始你的远征。</p></div><div class="aside-foot"><span class="status-dot"></span> 进度仅在本局保留<br><span id="best">本机纪录：尚无远征</span></div></aside>
    </div>
    <div class="action-bar"><div class="action-group"><button id="basic" class="skill"><kbd>Space</kbd><span>普通攻击</span><small>或点击敌人</small></button><button id="dash" class="skill"><kbd>Shift</kbd><span>暗影闪避</span><small id="dash-cd">就绪</small></button><button id="spin" class="skill"><kbd>1</kbd><span>旋风斩</span><small id="spin-cd">就绪</small></button><button id="frost" class="skill"><kbd>2</kbd><span>冰霜冲击</span><small id="frost-cd">就绪</small></button></div><div class="action-group"><button id="potion" class="skill potion"><kbd>Q</kbd><span>生命药水</span><small id="potions">3 瓶</small></button><button id="interact" class="skill"><kbd>E</kbd><span>拾取 / 下一层</span><small>也可点击地面</small></button></div></div>
    <footer><span>走进深渊，把传说带回来。</span><span>推荐电脑浏览器 · 键盘与鼠标</span></footer>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <script type="module" src="./game.mjs"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebGL2.5D VFX QA</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071012;color:#d9c9a7;font:14px Segoe UI,Microsoft YaHei,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}.copy{position:fixed;z-index:2;top:24px;left:30px;pointer-events:none}.copy b{display:block;font-size:22px;letter-spacing:3px}.copy span{color:#7e958f}</style></head><body><canvas id="qa" width="1040" height="720"></canvas><div class="copy"><b>WEBGL 2.5D · VFX QA</b><span>遮罩材质 / 动态光照 / 拖尾 / 后处理 · 标准 Alpha 合成</span></div><script type="module">import{createWebGLVfxRenderer}from'./webgl-vfx.mjs';const canvas=document.getElementById('qa'),fx=createWebGLVfxRenderer(canvas);canvas.dataset.renderer=fx.available?'webgl2-instanced':'fallback';function frame(now){const t=now/1000;fx.beginFrame({time:t});const themes=[['#82b96b','#d8efad'],['#e66f32','#ffd08a'],['#858be2','#eef0ff'],['#c84b5d','#ffc0c5'],['#4cbccd','#d8fbff'],['#c79a34','#fff0a5']];for(let i=0;i<6;i++){const x=175+(i%3)*345,y=215+Math.floor(i/3)*310,[color,accent]=themes[i];fx.light(x,y,126,color,.18,.68,t+i);fx.disc(x,y,102,color,.15,.62,0,t+i);fx.sigil(x,y,94,accent,.56,t*(i%2?.16:-.16),t+i);fx.ring(x,y,112,color,.55,.024,.62,0,t+i);for(let j=0;j<7;j++){const a=j*Math.PI*2/7+t*.16,d=70+12*Math.sin(t+j);fx.shard(x+Math.cos(a)*d,y+Math.sin(a)*d*.6,7,a,accent,.55,t+j);}}fx.trail(120,650,290,24,-.08,'#d8efad',.62,t);fx.beam(520,650,290,46,0,'#e66f32',.42,t);fx.cone(845,650,-Math.PI/2,150,1.05,'#858be2',.5,t);fx.flush();requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
